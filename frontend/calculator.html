<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sameer Sharma Calculator</title>

  <style>
    body {
      background-color: aquamarine;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
    }

    .sameer-container {
      width: 320px;
      background: black;
      padding: 20px;
      border-radius: 10px;
    }

    .display {
      width: 100%;
      height: 60px;
      background: #111;
      color: aqua;
      font-size: 28px;
      text-align: right;
      padding: 10px;
      box-sizing: border-box;
      margin-bottom: 15px;
      border-radius: 5px;
      overflow: hidden;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .button {
      padding: 20px;
      background: grey;
      color: aqua;
      font-size: 20px;
      text-align: center;
      border-radius: 5px;
      cursor: pointer;
      user-select: none;
    }

    .button:hover {
      background: #555;
    }

    .operator {
      background: #333;
    }

    .equals {
      background: teal;
      grid-column: span 2;
    }

    .clear {
      background: crimson;
      grid-column: span 2;
    }
  </style>
</head>

<body>
  <div class="sameer-container">
    <div id="display" class="display">0</div>

    <div class="buttons">
      <!-- Buttons generated by JS -->
    </div>
  </div>

  <script>
    const display = document.getElementById("display");
    const buttonsContainer = document.querySelector(".buttons");

    const buttons = [
      "7", "8", "9", "/",
      "4", "5", "6", "*",
      "1", "2", "3", "-",
      "0", ".", "+",
      "C", "="
    ];

    let currentInput = "";

    buttons.forEach((btn) => {
      const button = document.createElement("div");
      button.classList.add("button");
      button.innerText = btn;

      if (["+", "-", "*", "/"].includes(btn)) {
        button.classList.add("operator");
      }

      if (btn === "=") {
        button.classList.add("equals");
      }

      if (btn === "C") {
        button.classList.add("clear");
      }

      button.addEventListener("click", () => handleClick(btn));
      buttonsContainer.appendChild(button);
    });

    function handleClick(value) {
      if (value === "C") {
        currentInput = "";
        display.innerText = "0";
        return;
      }

      if (value === "=") {
        try {
          currentInput = eval(currentInput).toString();
          display.innerText = currentInput;
        } catch {
          display.innerText = "Error";
          currentInput = "";
        }
        return;
      }

      currentInput += value;
      display.innerText = currentInput;
    }
  </script>
</body>
</html>
